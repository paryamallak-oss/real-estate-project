<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه املاک</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; }
        .auth-card { max-width: 400px; margin: 80px auto; border: none; border-radius: 12px; }
        .form-control { border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card auth-card shadow-sm p-4">
            <h3 class="fw-bold text-center mb-4">ورود به حساب</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">نام کاربری</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">رمز عبور</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">ورود</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">حساب کاربری ندارید؟ <a href="{% url 'signup' %}">ثبت‌نام کنید</a></small>
            </div>
        </div>
    </div>

</body>
</html>
